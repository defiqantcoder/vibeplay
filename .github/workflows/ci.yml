name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Set up python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 xvfb libgl1-mesa-glx libasound2-dev pulseaudio libgirepository1.0-dev

    - name: Install Python dependencies
      run: |
        uv sync --all-extras --dev

    - name: Lint and format with ruff
      run: |
        uv run --with ruff ruff check .
        uv run --with ruff ruff format --check .

    - name: Test with pytest
      run: |
        xvfb-run -a uv run pytest --cov=src/vibeplay --cov=src/vibe_dsp tests/ -v
