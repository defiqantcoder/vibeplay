app-id: com.vibeplay.VibePlay
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: vibeplay-desktop

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --filesystem=xdg-music:ro
  - --filesystem=home:ro

modules:
  - name: vibeplay
    buildsystem: simple
    build-commands:
      - install -Dm755 dist/vibeplay-desktop /app/bin/vibeplay-desktop
      - install -Dm644 packaging/vibeplay.desktop /app/share/applications/com.vibeplay.VibePlay.desktop
      - install -Dm644 packaging/icons/vibeplay.svg /app/share/icons/hicolor/scalable/apps/com.vibeplay.VibePlay.svg
    sources:
      - type: dir
        path: ../..
