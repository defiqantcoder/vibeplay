[project]
name = "vibeplay"
version = "0.1.0"
description = "Local music library scanner, metadata enricher, audio feature analyzer, and vibe-based smart playlist generator."
readme = "README.md"
authors = [
    { name = "defiqantcoder", email = "starwarshellyeah69@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "essentia-tensorflow>=2.1b6.dev1389",
    "fastapi>=0.159.1",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "librosa>=1.0.0",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.48.1",
    "pyacoustid>=1.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "python-mpd2>=3.1.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
vibeplay = "vibeplay.cli:app"
vibe-dsp = "vibe_dsp.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
