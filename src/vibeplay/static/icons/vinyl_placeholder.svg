<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylShine" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="45%" stop-color="#18181c"/>
      <stop offset="70%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Vinyl Disc Body -->
  <circle cx="100" cy="100" r="96" fill="url(#vinylShine)" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Concentric Sound Grooves -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="8,2,4,3"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#27272a" stroke-width="0.75"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#3f3f46" stroke-width="0.5" stroke-dasharray="12,3,6,2"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="#27272a" stroke-width="0.75"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#3f3f46" stroke-width="0.5"/>

  <!-- Center Label Area -->
  <circle cx="100" cy="100" r="36" fill="url(#labelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#083344" stroke-width="0.75" opacity="0.6"/>

  <!-- Center Label Typography -->
  <text x="100" y="85" text-anchor="middle" font-family="monospace, sans-serif" font-size="8" font-weight="900" fill="#082f49" letter-spacing="1.5">VIBEPLAY</text>
  <text x="100" y="93" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="700" fill="#0c4a6e" letter-spacing="0.5">LOSSLESS MASTER</text>
  <text x="100" y="117" text-anchor="middle" font-family="monospace, sans-serif" font-size="6" font-weight="700" fill="#082f49">33⅓ RPM</text>

  <!-- Center Spindle Hole -->
  <circle cx="100" cy="100" r="7" fill="#09090b" stroke="#71717a" stroke-width="1"/>
  <circle cx="100" cy="100" r="3.5" fill="#000000"/>
</svg>
