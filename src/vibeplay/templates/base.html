<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}vibeplay — Audiophile Precision Console{% endblock %}</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <!-- HTMX & Styles -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/style.css"/>
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">vibeplay</span>
      <span class="brand-badge">Bit-Perfect Core</span>
    </div>
    
    <nav class="nav-tabs">
      <button id="nav-btn-library" class="nav-tab-btn active" onclick="showTab('library')">
        <span class="material-symbols-outlined" style="font-size: 18px;">library_music</span>
        Library
      </button>
      <button id="nav-btn-clusters" class="nav-tab-btn" onclick="showTab('clusters')">
        <span class="material-symbols-outlined" style="font-size: 18px;">hub</span>
        Clusters
      </button>
      <button id="nav-btn-builder" class="nav-tab-btn" onclick="showTab('builder')">
        <span class="material-symbols-outlined" style="font-size: 18px;">queue_music</span>
        Playlist Builder
      </button>
    </nav>
    
    <div class="header-right">
      <div id="header-status-pill" class="status-pill {% if playback.daemon_online %}online{% else %}standby{% endif %}">
        <span class="pulse-dot"></span>
        <span>{% if playback.daemon_online %}MPD Locked{% else %}Direct ALSA{% endif %}</span>
      </div>
      <span class="badge-spec">{{ total_tracks }} Tracks</span>
    </div>
  </header>

  <!-- Page Body -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Persistent Bottom Transport Player Bar -->
  <footer id="transport-footer-container">
    {% include "components/transport_bar.html" %}
  </footer>

  <!-- Track Detail Modal Container -->
  <dialog id="track-detail-modal" class="modal-dialog" closedby="any" aria-labelledby="modal-track-title">
    <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
      Loading audio metadata...
    </div>
  </dialog>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
