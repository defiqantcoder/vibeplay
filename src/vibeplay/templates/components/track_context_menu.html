{# Track Context Menu Popover #}
<div id="track-context-menu" class="fixed z-50 w-56 rounded-2xl bg-[var(--surface-container)] border border-[var(--border)] p-1.5 shadow-2xl flex flex-col gap-0.5 text-xs font-mono text-[var(--text-primary)] hidden" onclick="event.stopPropagation();">
  <!-- Track Label Header -->
  <div class="px-3 py-2 border-b border-[var(--border)]/60 text-[11px] flex flex-col">
    <span id="context-track-title" class="font-bold truncate text-[var(--text-primary)]">Track Title</span>
    <span id="context-track-artist" class="text-[10px] text-[var(--text-muted)] truncate">Artist</span>
  </div>

  <!-- Menu Actions -->
  <button type="button" class="w-full px-3 py-2 rounded-xl text-left hover:bg-[var(--surface)] hover:text-[var(--accent)] flex items-center gap-2.5 transition-colors" onclick="contextActionPlayNow()">
    <span>▶️</span>
    <span>Play Now</span>
  </button>
  <button type="button" class="w-full px-3 py-2 rounded-xl text-left hover:bg-[var(--surface)] hover:text-[var(--accent)] flex items-center gap-2.5 transition-colors" onclick="contextActionPlayNext()">
    <span>⏭️</span>
    <span>Play Next in Queue</span>
  </button>
  <button type="button" class="w-full px-3 py-2 rounded-xl text-left hover:bg-[var(--surface)] hover:text-[var(--accent)] flex items-center gap-2.5 transition-colors" onclick="contextActionAddToQueue()">
    <span>➕</span>
    <span>Add to End of Queue</span>
  </button>
  <div class="h-[1px] bg-[var(--border)]/60 my-0.5"></div>
  <button type="button" class="w-full px-3 py-2 rounded-xl text-left hover:bg-[var(--surface)] hover:text-[var(--accent)] flex items-center gap-2.5 transition-colors" onclick="contextActionInspectVibe()">
    <span>✨</span>
    <span>Inspect Track Vibe</span>
  </button>
  <button type="button" class="w-full px-3 py-2 rounded-xl text-left hover:bg-[var(--surface)] hover:text-[var(--accent)] flex items-center gap-2.5 transition-colors" onclick="contextActionFindSimilar()">
    <span>〰️</span>
    <span>Find Similar Energy</span>
  </button>
</div>
