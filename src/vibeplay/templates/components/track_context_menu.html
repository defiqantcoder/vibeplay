{# Track Context Menu Popover (Stitch Design Specification) #}
<div id="track-context-menu" data-stitch-id="contextMenuPopover" class="fixed z-50 w-[220px] rounded-2xl bg-surface-container-high border border-outline-variant/30 p-1.5 shadow-[0_24px_48px_-8px_rgba(0,0,0,0.85)] animate-in fade-in zoom-in-95 duration-150 backdrop-blur-xl hidden select-none flex flex-col gap-0.5" onclick="event.stopPropagation();">
  <!-- Track Label Header (Stitch Node Action Spec) -->
  <div class="px-2.5 py-1.5 flex flex-col border-b border-surface-container-highest/60 mb-1 rounded-xl bg-surface-container-lowest/40">
    <div class="flex items-center justify-between text-[10px] font-label-sm text-outline tracking-wider uppercase mb-0.5">
      <span>Node Action</span>
      <span class="text-primary font-bold">#01 // FOB</span>
    </div>
    <span id="context-track-title" class="font-bold truncate text-on-surface font-label-md text-label-md">Track Title</span>
    <span id="context-track-artist" class="text-[10px] text-on-surface-variant truncate font-label-sm">Artist</span>
  </div>

  <!-- Menu Actions (Stitch exact layout, hover states, Material Symbols, and retained onclicks) -->
  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface font-label-md text-label-md hover:bg-surface-bright hover:text-primary transition cursor-pointer select-none text-left" onclick="contextActionPlayNow()">
    <span class="material-symbols-outlined text-[18px] text-primary">play_arrow</span>
    <span class="font-medium">Play Right Now</span>
  </button>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface font-label-md text-label-md hover:bg-surface-bright hover:text-on-surface transition cursor-pointer select-none text-left" onclick="contextActionPlayNext()">
    <span class="material-symbols-outlined text-[18px] text-on-surface-variant">skip_next</span>
    <span>Play Next in Line</span>
  </button>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-primary font-label-md text-label-md hover:bg-surface-bright font-medium transition cursor-pointer select-none text-left" onclick="contextActionAddToQueue()">
    <span class="material-symbols-outlined text-[18px] text-primary-container">soup_kitchen</span>
    <span>Toss into Vibe Cooker</span>
  </button>

  <div class="h-px bg-surface-container-highest my-1 w-full"></div>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface font-label-md text-label-md hover:bg-surface-bright hover:text-secondary transition cursor-pointer select-none text-left" onclick="contextActionInspectVibe()">
    <span class="material-symbols-outlined text-[18px] text-secondary">insights</span>
    <span>Check Song Vibes</span>
  </button>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface font-label-md text-label-md hover:bg-surface-bright hover:text-tertiary transition cursor-pointer select-none text-left" onclick="contextActionFindSimilar()">
    <span class="material-symbols-outlined text-[18px] text-tertiary">graphic_eq</span>
    <span>Find Similar Tempo</span>
  </button>

  <div class="h-px bg-surface-container-highest my-1 w-full"></div>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface font-label-md text-label-md hover:bg-surface-bright hover:text-on-surface transition cursor-pointer select-none text-left" onclick="closeContextMenu()">
    <span class="material-symbols-outlined text-[18px] text-on-surface-variant">folder_open</span>
    <span>Show in Explorer</span>
  </button>

  <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-error font-label-md text-label-md hover:bg-error-container/30 transition cursor-pointer select-none text-left" onclick="closeContextMenu()">
    <span class="material-symbols-outlined text-[18px] text-error">delete</span>
    <span>Remove from Crate</span>
  </button>
</div>
